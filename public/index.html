<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nomi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head><body>
<main>
  <section id="v-map" class="view on">
    <div id="map"></div>
    <button id="pill" aria-label="Состояние соединения"><i></i><span>Подключение…</span></button>
    <div id="fab">
      <button id="gps" aria-label="Моя геопозиция"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button id="meet" aria-label="Найти место встречи"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
    </div>
    <div id="spotcard" hidden></div>
  </section>
  <section id="v-friends" class="view"><header><h1>Друзья</h1><input id="fsearch" type="search" placeholder="Поиск по имени"></header><div id="flist" class="list"></div></section>
  <section id="v-chats" class="view"><header><h1>Чаты</h1></header><div id="clist" class="list"></div></section>
  <section id="v-me" class="view">
    <header><h1>Профиль</h1></header>
    <div class="body">
      <div id="mav-wrap"></div>
      <label>Имя<input id="pname" maxlength="20" autocomplete="off"></label>
      <label>Статус<input id="pbio" maxlength="60" placeholder="Чем занимаетесь?" autocomplete="off"></label>
      <div class="lbl">Цвет</div><div id="sw"></div>
      <div class="lbl">Соединение</div><div id="diag"></div>
      <button id="tp" class="ghost">Проверка: «телепорт» (сервер должен отклонить)</button>
    </div>
  </section>
</main>
<nav id="tabs">
  <button data-v="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Карта</button>
  <button data-v="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5"/></svg>Друзья</button>
  <button data-v="chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Чаты<b id="badge" hidden>0</b></button>
  <button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6 8-6s7.2 1.8 8 6"/></svg>Профиль</button>
</nav>
<div id="profile" class="ov" aria-hidden="true"><div class="bar"><button class="back" aria-label="Назад">←</button></div><div id="pbody" class="body"></div></div>
<div id="dialog" class="ov" aria-hidden="true">
  <div class="bar"><button class="back" aria-label="Назад">←</button><button id="dhead"></button></div>
  <div id="dmsgs"></div>
  <form id="f"><button type="button" id="cam" aria-label="Записать кружок"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></button><input id="txt" placeholder="Сообщение" autocomplete="off" maxlength="500"><button aria-label="Отправить">↑</button></form>
</div>
<video id="prev" muted playsinline hidden></video>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
